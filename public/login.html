<!DOCTYPE html>
<html>
<head>
  <title>Login | AI Job Simulator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="auth-page">
  <div class="auth-card">
    <span class="eyebrow">AI Job Simulator</span>
    <h1>Welcome back</h1>
    <p class="subtitle">Continue building your workplace confidence.</p>
    <div id="clerk-sign-in"></div>
    <p id="auth-status" class="subtitle" role="status">Loading sign-in options...</p>
    <a class="link" href="signup.html">Create a new account</a>
  </div>
  </div>
  <script src="./clerk-auth.js"></script>
  <script>
    const authStatus = document.getElementById('auth-status');
    window.clerkReady.then(clerk => {
      if (!clerk) {
        authStatus.textContent = 'Clerk is not configured. Add the Clerk API keys to the backend environment, then restart the server.';
        return;
      }
      if (clerk.isSignedIn) {
        window.location.replace('./index.html');
        return;
      }
      clerk.mountSignIn(document.getElementById('clerk-sign-in'), {
        forceRedirectUrl: '/index.html',
        fallbackRedirectUrl: '/index.html'
      });
      authStatus.textContent = '';
    }).catch(error => {
      console.error('Clerk sign-in could not be loaded:', error);
      authStatus.textContent = error.message;
    });
  </script>
</body>
</html>
